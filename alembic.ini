# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = app/migrations

# template used to generate migration file names; The default value is %%(rev)s_%(slug)s
# Just uncomment the line below if you want to change the default one
# file_template = %%(rev)s_%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, must be an IANA timezone string such as "UTC",
# "US/Eastern", "Europe/Paris". The special value "local" can be used
# to specify the system-local timezone.
# timezone =

# version number format; "%%(rev)s", "%%(epoch)s", "%%(year)d",
# "%%(month).2d", "%%(day).2d", "%%(hour).2d", "%%(minute).2d",
# "%%(second).2d" are all available.
# For example, "%%(year)d%%(month).2d%%(day).2d_%%(rev)s"
# file_template = %%(rev)s_%(slug)s

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts. See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner, against the "black" entrypoint
# hooks=black
# black.type=console_scripts
# black.entrypoint=black
# black.options=-l 79

# format using "ruff" - use the exec runner, execute a binary
# hooks=ruff
# ruff.type=exec
# ruff.executable=ruff
# ruff.options=check --fix --exit-zero

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

